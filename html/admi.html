<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administrador - GYM Arnolt Classic</title>

    <style>

        body {
            margin: 0;
            padding: 30px;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            color: #39ff14;
        }

        .contenedor {
            max-width: 1100px;
            margin: auto;
        }

        .formulario {
            background: #1b1b1b;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .formulario h2 {
            color: #39ff14;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            margin: 8px 0;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #292929;
            color: white;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .agregar {
            background: #39ff14;
            color: black;
        }

        .cancelar {
            background: #555;
            color: white;
            margin-left: 5px;
        }

        .productos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .producto {
            background: #1b1b1b;
            padding: 20px;
            border-radius: 12px;
        }

        .producto img {
            width: 100%;
            height: 220px;
            object-fit: contain;
            background: white;
            border-radius: 8px;
        }

        .producto h3 {
            color: #39ff14;
        }

        .precio {
            font-size: 22px;
            font-weight: bold;
        }

        .editar {
            background: #ffc107;
            margin-top: 10px;
        }

        .eliminar {
            background: #e53935;
            color: white;
            margin-top: 10px;
        }

        #mensaje {
            margin: 15px 0;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="contenedor">

    <h1>GYM ARNOLT CLASSIC</h1>

    <div class="formulario">

        <h2 id="titulo-formulario">
            AGREGAR PRODUCTO
        </h2>

        <input
            type="text"
            id="nombre"
            placeholder="Nombre del producto">

        <textarea
            id="descripcion"
            placeholder="Descripción del producto"></textarea>

        <input
            type="number"
            id="precio"
            placeholder="Precio">

        <input
            type="text"
            id="imagen"
            placeholder="Ruta de la imagen">

        <button
            class="agregar"
            onclick="guardarProducto()">
            GUARDAR PRODUCTO
        </button>

        <button
            class="cancelar"
            onclick="cancelarEdicion()"
            id="btn-cancelar"
            style="display:none;">
            CANCELAR
        </button>

        <div id="mensaje"></div>

    </div>

    <h2>PRODUCTOS</h2>

    <div
        id="productos"
        class="productos">
    </div>

</div>


<script>

const URL = "";

let idEditando = null;


// ===============================
// MOSTRAR PRODUCTOS
// ===============================

function cargarProductos() {

    fetch(URL + "/productos")

        .then(function(respuesta) {
            return respuesta.json();
        })

        .then(function(productos) {

            const contenedor =
                document.getElementById("productos");

            contenedor.innerHTML = "";

            productos.forEach(function(producto) {

                contenedor.innerHTML += `

                    <div class="producto">

                        <img
                            src="${producto.imagen}"
                            alt="${producto.nombre}">

                        <h3>
                            ${producto.nombre}
                        </h3>

                        <p>
                            ${producto.descripcion}
                        </p>

                        <p class="precio">
                            Bs ${producto.precio}
                        </p>

                        <button
                            class="editar"
                            onclick="editarProducto(
                                ${producto.id},
                                '${producto.nombre.replace(/'/g, "\\'")}',
                                '${producto.descripcion.replace(/'/g, "\\'")}',
                                ${producto.precio},
                                '${producto.imagen.replace(/'/g, "\\'")}'
                            )">
                            EDITAR
                        </button>

                        <button
                            class="eliminar"
                            onclick="eliminarProducto(${producto.id})">
                            ELIMINAR
                        </button>

                    </div>

                `;
            });

        })

        .catch(function(error) {

            console.log(error);

            document.getElementById("mensaje").textContent =
                "No se pudo conectar con el servidor.";

        });
}


// ===============================
// GUARDAR / MODIFICAR
// ===============================

function guardarProducto() {

    const nombre =
        document.getElementById("nombre").value;

    const descripcion =
        document.getElementById("descripcion").value;

    const precio =
        document.getElementById("precio").value;

    const imagen =
        document.getElementById("imagen").value;


    if (!nombre || !descripcion || !precio || !imagen) {

        alert("Completa todos los campos.");

        return;
    }


    const datos = {
        nombre: nombre,
        descripcion: descripcion,
        precio: precio,
        imagen: imagen
    };


    let url;
    let metodo;


    if (idEditando === null) {

        url = URL + "/productos";
        metodo = "POST";

    } else {

        url = URL + "/productos/" + idEditando;
        metodo = "PUT";

    }


    fetch(url, {

        method: metodo,

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(datos)

    })

    .then(function(respuesta) {
        return respuesta.json();
    })

    .then(function(datos) {

        if (datos.error) {

            alert(datos.error);

            return;
        }

        alert(datos.mensaje);

        limpiarFormulario();

        cargarProductos();

    })

    .catch(function(error) {

        console.log(error);

        alert("No se pudo conectar con el servidor.");

    });

}


// ===============================
// EDITAR
// ===============================

function editarProducto(
    id,
    nombre,
    descripcion,
    precio,
    imagen
) {

    idEditando = id;

    document.getElementById("nombre").value =
        nombre;

    document.getElementById("descripcion").value =
        descripcion;

    document.getElementById("precio").value =
        precio;

    document.getElementById("imagen").value =
        imagen;

    document.getElementById("titulo-formulario")
        .textContent =
        "MODIFICAR PRODUCTO";

    document.getElementById("btn-cancelar")
        .style.display =
        "inline-block";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


// ===============================
// ELIMINAR
// ===============================

function eliminarProducto(id) {

    const confirmar =
        confirm("¿Quieres eliminar este producto?");

    if (!confirmar) {
        return;
    }


    fetch(
        URL + "/productos/" + id,
        {
            method: "DELETE"
        }
    )

    .then(function(respuesta) {
        return respuesta.json();
    })

    .then(function(datos) {

        if (datos.error) {

            alert(datos.error);

            return;
        }

        alert(datos.mensaje);

        cargarProductos();

    })

    .catch(function(error) {

        console.log(error);

        alert("No se pudo conectar con el servidor.");

    });

}


// ===============================
// CANCELAR EDICIÓN
// ===============================

function cancelarEdicion() {

    limpiarFormulario();

}


// ===============================
// LIMPIAR
// ===============================

function limpiarFormulario() {

    idEditando = null;

    document.getElementById("nombre").value = "";
    document.getElementById("descripcion").value = "";
    document.getElementById("precio").value = "";
    document.getElementById("imagen").value = "";

    document.getElementById("titulo-formulario")
        .textContent =
        "AGREGAR PRODUCTO";

    document.getElementById("btn-cancelar")
        .style.display =
        "none";

}


// CARGAR AL ABRIR
cargarProductos();

</script>

</body>

</html>
